<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MK Fragrance</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0b0b0b;color:#fff}
header{padding:28px 20px;background:#111;text-align:center;border-bottom:2px solid #f5c400}
.logo{font-size:32px;font-weight:800;color:#f5c400;letter-spacing:2px}.tag{color:#ddd;margin-top:5px}
nav{display:flex;gap:8px;padding:12px;background:#151515;position:sticky;top:0;z-index:2}
nav button{flex:1;border:1px solid #f5c400;background:#111;color:#f5c400;padding:11px;border-radius:8px;font-weight:bold}
main{padding:18px;max-width:700px;margin:auto}.hero{background:linear-gradient(135deg,#161616,#2b2400);padding:25px;border-radius:16px;text-align:center;margin-bottom:18px}
.hero h1{color:#f5c400;margin:0 0 8px}.hero p{color:#ddd}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:#151515;border:1px solid #333;border-radius:14px;padding:16px}.bottle{height:150px;border-radius:12px;background:#050505;border:1px solid #f5c400;display:flex;align-items:center;justify-content:center;text-align:center;color:#f5c400;font-weight:bold}
.card h3{margin:12px 0 5px}.price{color:#f5c400;font-size:20px;font-weight:bold}.buy{width:100%;margin-top:12px;padding:12px;border:0;border-radius:9px;background:#f5c400;color:#000;font-weight:800}
.contact{margin-top:20px;padding:18px;background:#151515;border-radius:14px;text-align:center}.wa{display:inline-block;margin-top:10px;padding:12px 18px;background:#f5c400;color:#000;text-decoration:none;border-radius:9px;font-weight:bold}
@media(max-width:480px){.grid{grid-template-columns:1fr}}

.ad-wrap{margin-bottom:18px;border:1px solid #f5c400;border-radius:16px;overflow:hidden;background:#111}
.ad{display:block;width:100%;height:auto}
</style>
</head>
<body>
<header><div class="logo">👑 MK FRAGRANCE</div><div class="tag">Premium Perfumes</div></header>
<nav><button onclick="show('all')">Home</button><button onclick="show('men')">Men</button><button onclick="show('women')">Women</button><button onclick="cart()">Cart 🛒</button></nav>
<main><div class="ad-wrap">
<img class="ad" src="mk-fragrance-ad.png" alt="MK Fragrance J. Janan and Gucci Flora advertisement">
</div>

<section class="hero"><h1>Born To Stand Out</h1><p>Premium fragrances for every occasion.</p></section>
<div id="products" class="grid"></div>
<div class="contact"><b>Order on WhatsApp</b><br>0346 3259491<br><a class="wa" href="https://wa.me/923463259491?text=Assalamualaikum%20MK%20Fragrance%2C%20I%20want%20to%20place%20an%20order.">Order Now</a></div>
</main>
<script>
const products=[
{name:'J. Janan',cat:'men',price:2500},
{name:'Gucci Flora',cat:'women',price:2500}
];
let cartItems=[];
function show(cat){const list=cat==='all'?products:products.filter(p=>p.cat===cat);document.getElementById('products').innerHTML=list.map((p,i)=>`
<div class="card"><div class="bottle">MK<br>${p.name}</div><h3>${p.name}</h3><div>${p.cat==='men'?'Men':'Women'}</div><div class="price">Rs. ${p.price.toLocaleString()}</div><button class="buy" onclick="add(${products.indexOf(p)})">Add to Cart</button></div>`).join('')}
function add(i){cartItems.push(products[i]);alert(products[i].name+' added to cart!')}
function cart(){alert(cartItems.length?cartItems.map(x=>x.name+' — Rs. '+x.price).join('\n'):'Your cart is empty.')}
show('all');
</script>
</body>
</html>
